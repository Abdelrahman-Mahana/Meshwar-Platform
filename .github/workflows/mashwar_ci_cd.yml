name: MASHWAR Platform CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  analyze-and-test:
    name: Static Analysis & Full Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart & Flutter dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run automated unit & widget tests
        run: flutter test --reporter expanded

  build-production-bundles:
    name: Build Consumer App & Admin Command Center
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Consumer Web App
        run: flutter build web --release --base-href / --dart-define=APP_ENV=production --dart-define=USE_FIREBASE=true

      - name: Build Standalone Admin & DevOps Portal
        run: flutter build web --release -t lib/admin_main.dart --base-href /admin/ -o build/web/admin --dart-define=APP_ENV=production --dart-define=USE_FIREBASE=true

      - name: Verify build manifest & health endpoint
        run: |
          test -f build/web/index.html
          test -f build/web/admin/index.html
          test -f build/web/health.json

      - name: Upload production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: mashwar-web-bundle
          path: build/web
          retention-days: 14
