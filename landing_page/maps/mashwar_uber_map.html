<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MASHWAR Live Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./leaflet/leaflet.css" />
  <style>
    :root {
      --navy: #0F2A43;
      --teal: #1B7F79;
      --teal-soft: rgba(27, 127, 121, 0.16);
      --gold: #F5A524;
      --red: #EF4444;
      --green: #10B981;
      --surface: rgba(255, 255, 255, 0.94);
      --surface-solid: #FFFFFF;
      --border: rgba(15, 42, 67, 0.14);
      --text: #0F2A43;
      --text-muted: #51647A;
      --shadow: 0 6px 20px rgba(15, 42, 67, 0.14);
      --shadow-sm: 0 3px 10px rgba(15, 42, 67, 0.12);
    }

    body.theme-dark {
      --surface: rgba(15, 27, 40, 0.92);
      --surface-solid: #122234;
      --border: rgba(255, 255, 255, 0.14);
      --text: #F4F8FB;
      --text-muted: #9CB2C9;
      --shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
      --shadow-sm: 0 3px 10px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #E8EEF2;
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Tahoma, sans-serif;
      color: var(--text);
      user-select: none;
    }

    body.theme-dark {
      background: #101A24;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Hide default Leaflet controls; we render sleek Uber HUD controls */
    .leaflet-control-zoom {
      display: none !important;
    }

    .leaflet-control-attribution {
      background: rgba(255, 255, 255, 0.72) !important;
      backdrop-filter: blur(6px);
      font-size: 9px !important;
      padding: 1px 6px !important;
      border-radius: 8px !important;
      margin: 0 8px 6px 8px !important;
      color: #51647A !important;
      border: 1px solid rgba(15, 42, 67, 0.08);
    }

    body.theme-dark .leaflet-control-attribution {
      background: rgba(15, 27, 40, 0.75) !important;
      color: #9CB2C9 !important;
      border-color: rgba(255, 255, 255, 0.1);
    }

    body.theme-uber .leaflet-tile-pane {
      filter: saturate(0.52) contrast(1.04) brightness(1.03);
    }

    body.theme-dark .leaflet-tile-pane {
      filter: invert(93%) hue-rotate(180deg) brightness(94%) contrast(92%) saturate(78%);
    }

    .leaflet-control-attribution a {
      color: inherit !important;
      text-decoration: none !important;
    }

    /* Floating Uber HUD Layer */
    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 600;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .hud-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }

    .hud-bottom {
      align-items: flex-end;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: auto;
    }

    .hud-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      pointer-events: auto;
    }

    /* Telemetry Pill (Top-Start) */
    .telemetry-pill {
      pointer-events: auto;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 6px 11px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1px;
      max-width: min(64vw, 310px);
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .telemetry-main {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .telemetry-sub {
      font-size: 10.5px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 8px;
      background: var(--green);
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55);
      animation: livePulse 2s infinite;
    }

    .live-dot.moderate {
      background: var(--gold);
      box-shadow: 0 0 0 0 rgba(245, 165, 36, 0.55);
      animation: livePulseAmber 2s infinite;
    }

    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
      70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    @keyframes livePulseAmber {
      0% { box-shadow: 0 0 0 0 rgba(245, 165, 36, 0.55); }
      70% { box-shadow: 0 0 0 7px rgba(245, 165, 36, 0); }
      100% { box-shadow: 0 0 0 0 rgba(245, 165, 36, 0); }
    }

    .traffic-tag {
      display: inline-flex;
      align-items: center;
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.14);
      color: #0D7A56;
    }

    .traffic-tag.moderate {
      background: rgba(245, 165, 36, 0.18);
      color: #A46205;
    }

    body.theme-dark .traffic-tag {
      background: rgba(16, 185, 129, 0.22);
      color: #6EE7B7;
    }

    body.theme-dark .traffic-tag.moderate {
      background: rgba(245, 165, 36, 0.24);
      color: #FCD34D;
    }

    /* Uber Pill Buttons */
    .uber-btn {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      border-radius: 999px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
      line-height: 1.1;
      white-space: nowrap;
    }

    .uber-btn:active {
      transform: scale(0.95);
    }

    .uber-btn.active {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
    }

    body.theme-dark .uber-btn.active {
      background: var(--teal);
      border-color: var(--teal);
      color: #FFFFFF;
    }

    .uber-btn svg {
      width: 13px;
      height: 13px;
      flex: 0 0 13px;
    }

    .zoom-stack {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .zoom-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      width: 32px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      line-height: 1;
      transition: background 0.15s ease;
    }

    .zoom-btn:hover {
      background: rgba(15, 42, 67, 0.07);
    }

    body.theme-dark .zoom-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .zoom-btn + .zoom-btn {
      border-top: 1px solid var(--border);
    }

    /* Service Badge (Bottom-Start) */
    .service-badge {
      pointer-events: auto;
      background: var(--surface);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 10.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow-sm);
      color: var(--text);
    }

    .service-swatch {
      width: 8px;
      height: 8px;
      border-radius: 3px;
      background: var(--teal);
    }

    .service-swatch.parcel { background: #1B7F79; }
    .service-swatch.supply { background: #F5A524; }
    .service-swatch.trip { background: #0F2A43; }
    .service-swatch.place { background: #1B7F79; }

    /* Custom Leaflet Pin Icons & Uber Floating Labels */
    .mw-pin-wrap {
      position: relative;
      width: 0;
      height: 0;
      overflow: visible;
    }

    .mw-origin-dot {
      position: absolute;
      left: -9px;
      top: -9px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--teal);
      border: 3px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(15, 42, 67, 0.32);
    }

    .mw-origin-pulse {
      position: absolute;
      left: -18px;
      top: -18px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(27, 127, 121, 0.28);
      animation: pinRadar 2.1s ease-out infinite;
    }

    @keyframes pinRadar {
      0% { transform: scale(0.45); opacity: 0.9; }
      100% { transform: scale(1.65); opacity: 0; }
    }

    .mw-dest-square {
      position: absolute;
      left: -9px;
      top: -9px;
      width: 18px;
      height: 18px;
      border-radius: 5px;
      background: var(--navy);
      border: 3px solid #FFFFFF;
      box-shadow: 0 3px 10px rgba(15, 42, 67, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mw-dest-square::after {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 1.5px;
      background: #FFFFFF;
    }

    .mw-stop-diamond {
      position: absolute;
      left: -8px;
      top: -8px;
      width: 16px;
      height: 16px;
      background: var(--gold);
      border: 2.5px solid #FFFFFF;
      border-radius: 3px;
      transform: rotate(45deg);
      box-shadow: 0 3px 9px rgba(15, 42, 67, 0.28);
    }

    .mw-place-radar {
      position: absolute;
      left: -26px;
      top: -26px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(27, 127, 121, 0.22);
      border: 1.5px solid rgba(27, 127, 121, 0.45);
      animation: pinRadar 2.3s ease-out infinite;
    }

    .mw-place-core {
      position: absolute;
      left: -11px;
      top: -11px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--navy);
      border: 3.5px solid #FFFFFF;
      box-shadow: 0 4px 14px rgba(15, 42, 67, 0.36);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mw-place-core::after {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
    }

    .mw-pill {
      position: absolute;
      transform: translate(-50%, 0);
      background: var(--surface-solid);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      white-space: nowrap;
      max-width: 175px;
      overflow: hidden;
      text-overflow: ellipsis;
      box-shadow: var(--shadow-sm);
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .mw-pill.pos-top {
      bottom: 14px;
      left: 0;
    }

    .mw-pill.pos-bottom {
      top: 14px;
      left: 0;
    }

    .mw-pill-tag {
      color: var(--teal);
      font-weight: 800;
    }

    .mw-pill-tag.dest {
      color: var(--navy);
    }

    body.theme-dark .mw-pill-tag.dest {
      color: #7DD3FC;
    }

    .mw-pill-tag.stop {
      color: #C47B07;
    }

    .mw-pill-eta {
      background: rgba(15, 42, 67, 0.08);
      color: var(--navy);
      border-radius: 6px;
      padding: 0 5px;
      font-size: 10px;
      font-weight: 800;
    }

    body.theme-dark .mw-pill-eta {
      background: rgba(255, 255, 255, 0.14);
      color: #FFFFFF;
    }

    /* Hero Animated Vehicle Marker */
    .mw-vehicle-container {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      pointer-events: none;
    }

    .mw-vehicle-aura {
      position: absolute;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(27, 127, 121, 0.28) 0%, rgba(27, 127, 121, 0) 72%);
      animation: vehicleHalo 2.2s ease-in-out infinite;
    }

    .mw-vehicle-aura.supply {
      background: radial-gradient(circle, rgba(245, 165, 36, 0.34) 0%, rgba(245, 165, 36, 0) 72%);
    }

    @keyframes vehicleHalo {
      0%, 100% { transform: scale(0.92); opacity: 0.75; }
      50% { transform: scale(1.22); opacity: 1; }
    }

    .mw-vehicle-rotator {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform;
      filter: drop-shadow(0 4px 6px rgba(15, 42, 67, 0.35));
    }

    /* Nearby Cruising Uber Cars */
    .mw-nearby-rotator {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.74;
      will-change: transform;
      filter: drop-shadow(0 2px 3px rgba(15, 42, 67, 0.25));
      pointer-events: none;
    }

    /* Flowing Route Pulse */
    .mw-route-flow {
      stroke-dasharray: 10 18;
      animation: dashFlow 1.25s linear infinite;
    }

    @keyframes dashFlow {
      from { stroke-dashoffset: 28; }
      to { stroke-dashoffset: 0; }
    }

    /* Compact card heights (< 280px) tighten HUD so map stays ultra spacious */
    @media (max-height: 290px) {
      .hud { padding: 7px; }
      .telemetry-pill { padding: 4px 9px; border-radius: 11px; }
      .telemetry-main { font-size: 11px; }
      .telemetry-sub { display: none; }
      .uber-btn { padding: 4px 8px; font-size: 10.5px; }
      .zoom-btn { width: 28px; height: 26px; font-size: 15px; }
      .service-badge { padding: 3px 7px; font-size: 10px; }
      .mw-pill { font-size: 10px; padding: 2px 7px; max-width: 145px; }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="hud">
    <div class="hud-row">
      <div class="telemetry-pill" id="telemetryPill">
        <div class="telemetry-main">
          <span class="live-dot" id="liveDot"></span>
          <span id="telemetryPrimary">...</span>
          <span class="traffic-tag" id="trafficStatusTag"></span>
        </div>
        <div class="telemetry-sub" id="telemetrySecondary"></div>
      </div>

      <div class="hud-group">
        <button type="button" class="uber-btn" id="btnTraffic" aria-label="Toggle Traffic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="7" y="2" width="10" height="20" rx="3"/>
            <circle cx="12" cy="7" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="12" cy="17" r="1.5" fill="currentColor"/>
          </svg>
          <span id="btnTrafficLabel"></span>
        </button>

        <button type="button" class="uber-btn" id="btnLayer" aria-label="Switch Map Layer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 12 12 17 22 12"/>
            <polyline points="2 17 12 22 22 17"/>
          </svg>
          <span id="btnLayerLabel"></span>
        </button>
      </div>
    </div>

    <div class="hud-row hud-bottom">
      <div class="service-badge" id="serviceBadge">
        <span class="service-swatch" id="serviceSwatch"></span>
        <span id="serviceLabel"></span>
      </div>

      <div class="hud-col">
        <button type="button" class="uber-btn" id="btnRecenter" aria-label="Re-center Route">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
          </svg>
          <span id="btnRecenterLabel"></span>
        </button>

        <div class="zoom-stack">
          <button type="button" class="zoom-btn" id="btnZoomIn" aria-label="Zoom In">+</button>
          <button type="button" class="zoom-btn" id="btnZoomOut" aria-label="Zoom Out">&minus;</button>
        </div>
      </div>
    </div>
  </div>

  <script src="./leaflet/leaflet.js"></script>
  <script>
    (function () {
      'use strict';

      var params = new URLSearchParams(window.location.search);
      var lang = (params.get('lang') || 'ar').toLowerCase() === 'en' ? 'en' : 'ar';
      var isAr = lang === 'ar';

      document.documentElement.lang = lang;
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';

      var rawMode = (params.get('mode') || 'trip').toLowerCase();
      var validModes = ['trip', 'parcel', 'supply', 'place'];
      var mode = validModes.indexOf(rawMode) >= 0 ? rawMode : 'trip';

      var rawStyle = (params.get('style') || 'google').toLowerCase();
      var stylesOrder = ['google', 'uber', 'satellite', 'dark'];
      var currentStyle = stylesOrder.indexOf(rawStyle) >= 0 ? rawStyle : 'google';

      var showTraffic = params.get('traffic') !== '0';
      var showNearbyCars = params.get('nearby') !== '0';

      function parseNumAny(keys, fallback) {
        for (var i = 0; i < keys.length; i++) {
          var raw = params.get(keys[i]);
          if (raw !== null && raw !== '') {
            var v = parseFloat(raw);
            if (Number.isFinite(v)) return v;
          }
        }
        return fallback;
      }

      function parseStrAny(keys, fallback) {
        for (var i = 0; i < keys.length; i++) {
          var raw = params.get(keys[i]);
          if (raw && raw.trim()) return raw.trim();
        }
        return fallback;
      }

      var olat = parseNumAny(['fromLat', 'olat'], 25.2854);
      var olng = parseNumAny(['fromLng', 'olng'], 51.5310);
      var dlat = parseNumAny(['toLat', 'dlat'], 25.4357);
      var dlng = parseNumAny(['toLng', 'dlng'], 51.4910);
      var plat = parseNumAny(['placeLat', 'plat', 'fromLat', 'olat'], olat);
      var plng = parseNumAny(['placeLng', 'plng', 'fromLng', 'olng'], olng);

      var slatRaw = parseNumAny(['stopLat', 'slat'], NaN);
      var slngRaw = parseNumAny(['stopLng', 'slng'], NaN);
      var hasStopover = Number.isFinite(slatRaw) && Number.isFinite(slngRaw);

      var oname = parseStrAny(['fromName', 'oname'], isAr ? 'الدوحة' : 'Doha');
      var dname = parseStrAny(['toName', 'dname'], isAr ? 'لوسيل' : 'Lusail');
      var sname = parseStrAny(['stopName', 'sname'], isAr ? 'نقطة توقف' : 'Stopover');
      var pname = parseStrAny(['placeName', 'pname', 'fromName', 'oname'], oname || (isAr ? 'الدوحة' : 'Doha'));

      var distParam = parseNumAny(['dist', 'distanceKm'], NaN);
      var etaRaw = parseNumAny(['eta', 'durationMinutes'], NaN);
      var etaParam = Number.isFinite(etaRaw) ? Math.round(etaRaw) : NaN;
      var hwyParam = parseStrAny(['hwy', 'highway'], '');

      var isSameCoord = Math.abs(olat - dlat) < 0.00025 && Math.abs(olng - dlng) < 0.00025;
      if (isSameCoord && mode !== 'place') {
        mode = 'place';
        plat = olat;
        plng = olng;
        pname = oname;
      }

      var isRouteMode = mode !== 'place';

      // Localized strings
      var TEXT = {
        traffic: isAr ? 'الزحمة' : 'Traffic',
        recenterRoute: isAr ? 'توسيط المسار' : 'Fit Route',
        recenterPlace: isAr ? 'توسيط الموقع' : 'Re-center',
        fromPrefix: isAr ? 'من:' : 'From:',
        toPrefix: isAr ? 'إلى:' : 'To:',
        stopPrefix: isAr ? 'توقف:' : 'Stop:',
        kmUnit: isAr ? 'كم' : 'km',
        minShort: isAr ? 'د' : 'm',
        trafficClear: isAr ? 'الزحمة: سالكة' : 'Clear Traffic',
        trafficModerate: isAr ? 'حركة متوسطة' : 'Moderate',
        trafficOff: isAr ? 'الزحمة متوقفة' : 'Traffic Off',
        livePlaceSub: isAr ? 'خريطة مباشرة · 3 مركبات قريبة' : 'Live View · 3 nearby vehicles',
        layers: {
          google: isAr ? 'خريطة' : 'Google',
          uber: isAr ? 'أوبر' : 'Uber',
          satellite: isAr ? 'قمر صناعي' : 'Satellite',
          dark: isAr ? 'ليلي' : 'Dark'
        },
        services: {
          trip: isAr ? 'رحلة تشاركية مباشرة' : 'Live Shared Trip',
          parcel: isAr ? 'توصيل طرد على الطريق' : 'Express Route Parcel',
          supply: isAr ? 'توريد موقع العمل' : 'Worksite Supply Truck',
          place: isAr ? 'معاينة الموقع' : 'Location Preview'
        }
      };

      // Distance fallback calculator (Haversine)
      function haversineKm(aLat, aLng, bLat, bLng) {
        var R = 6371;
        var toRad = Math.PI / 180;
        var dLa = (bLat - aLat) * toRad;
        var dLn = (bLng - aLng) * toRad;
        var a = Math.sin(dLa / 2) * Math.sin(dLa / 2) +
                Math.cos(aLat * toRad) * Math.cos(bLat * toRad) *
                Math.sin(dLn / 2) * Math.sin(dLn / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      var routeDistKm = Number.isFinite(distParam) && distParam > 0
        ? Math.round(distParam)
        : Math.max(4, Math.round(haversineKm(olat, olng, dlat, dlng) * 1.2));
      var routeEtaMin = Number.isFinite(etaParam) && etaParam > 0
        ? etaParam
        : Math.max(8, Math.round((routeDistKm / 78) * 60) + 5);
      var routeHighway = hwyParam || (isAr ? 'طريق الدوحة السريع' : 'Doha Expressway');

      // Deterministic traffic profile per route (realistic Doha corridors)
      var routeHash = Math.abs(Math.round((olat * 1000 + dlat * 777 + olng * 513 + dlng * 331))) % 10;
      var hasModerateTraffic = routeDistKm >= 10 && (routeHash % 3 !== 0);

      // Initialize Leaflet Map
      var map = L.map('map', {
        center: isRouteMode ? [(olat + dlat) / 2, (olng + dlng) / 2] : [plat, plng],
        zoom: isRouteMode ? 11 : 14,
        zoomControl: false,
        attributionControl: true,
        preferCanvas: false,
        zoomSnap: 0.25,
        zoomDelta: 0.5
      });

      map.attributionControl.setPrefix('');

      // Track if user manually interacted so resize does not fight user panning
      var userManuallyMoved = false;
      map.on('dragstart', function () { userManuallyMoved = true; });

      // Tile Layers Factory
      var activeTileLayer = null;
      var fallbackUsed = false;

      function createTileLayer(styleKey, trafficEnabled) {

        return L.tileLayer(
          'https://mt{s}.google.com/vt/lyrs=' + lyrs + '&hl=' + hl + '&x={x}&y={y}&z={z}',

        document.body.classList.toggle('theme-dark', currentStyle === 'dark');

        fallbackUsed = false;
        activeTileLayer = createTileLayer(currentStyle, showTraffic);
        var tileErrors = 0;
        activeTileLayer.on('tileerror', function () {
          tileErrors++;
          if (tileErrors >= 6 && !fallbackUsed && currentStyle === 'satellite') {
            fallbackUsed = true;
            if (activeTileLayer) map.removeLayer(activeTileLayer);
            activeTileLayer = createTileLayer('google', showTraffic);
            activeTileLayer.addTo(map);
          }
        });
        activeTileLayer.addTo(map);
        updateHudUI();
        if (isRouteMode && activeRouteCoords.length >= 2) {
          renderRouteRibbon(activeRouteCoords);

      }

          '<path d="M16.5 14.5 C16.5 10.5 31.5 10.5 31.5 14.5 L30 20.5 L18 20.5 Z" fill="#0F2A43"/>' +

          '<rect x="16" y="5.5" width="4.5" height="2" rx="1" fill="#FEF08A"/>' +
          '<rect x="27.5" y="5.5" width="4.5" height="2" rx="1" fill="#FEF08A"/>' +
          '<rect x="16.5" y="41" width="4" height="1.8" rx="0.8" fill="#EF4444"/>' +
          '<rect x="27.5" y="41" width="4" height="1.8" rx="0.8" fill="#EF4444"/>' +
          '</svg>';
      }

      // Smooth Curved Multi-Point Highway Fallback Polyline
      function buildCurvedSegment(aLat, aLng, bLat, bLng, steps, curveScale) {
        var pts = [];
        var dLa = bLat - aLat;
        var dLn = bLng - aLng;
        for (var i = 0; i <= steps; i++) {
          var t = i / steps;
          var arch = Math.sin(t * Math.PI) * curveScale;
          pts.push([
            aLat + dLa * t + (-dLn * arch),
            aLng + dLn * t + (dLa * arch)
          ]);
        }
        return pts;
      }

      function buildFallbackRouteCoords() {
        if (hasStopover) {
          var leg1 = buildCurvedSegment(olat, olng, slatRaw, slngRaw, 22, 0.055);
          var leg2 = buildCurvedSegment(slatRaw, slngRaw, dlat, dlng, 22, -0.055);
          return leg1.concat(leg2.slice(1));
        }
        return buildCurvedSegment(olat, olng, dlat, dlng, 44, 0.058);
      }

      // Route Rendering Group (multi-segment traffic ribbon)
      var routeLayerGroup = L.layerGroup().addTo(map);
      var activeRouteCoords = [];
      var routeArcData = null;

      function computeArcData(coords) {
        var cum = [0];
        var total = 0;
        for (var i = 1; i < coords.length; i++) {
          var midLat = (coords[i - 1][0] + coords[i][0]) * 0.5 * Math.PI / 180;
          var dy = coords[i][0] - coords[i - 1][0];
          var dx = (coords[i][1] - coords[i - 1][1]) * Math.cos(midLat);
          total += Math.sqrt(dx * dx + dy * dy);
          cum.push(total);
        }
        return { coords: coords, cum: cum, total: total || 1e-6 };
      }

      function sampleAlongArc(arcData, progress) {
        var clamped = Math.max(0, Math.min(1, progress));
        var target = clamped * arcData.total;
        var coords = arcData.coords;
        var cum = arcData.cum;
        var idx = 0;
        while (idx < cum.length - 2 && cum[idx + 1] < target) {
          idx++;
        }
        var segLen = (cum[idx + 1] - cum[idx]) || 1e-9;
        var localT = Math.max(0, Math.min(1, (target - cum[idx]) / segLen));
        var p0 = coords[idx];
        var p1 = coords[idx + 1] || p0;
        var lat = p0[0] + (p1[0] - p0[0]) * localT;
        var lng = p0[1] + (p1[1] - p0[1]) * localT;

        // Smooth bearing lookahead
        var lookIdx = Math.min(coords.length - 1, idx + 2);
        var pLook = coords[lookIdx];
        var dy = pLook[0] - p0[0];
        var dx = (pLook[1] - p0[1]) * Math.cos(lat * Math.PI / 180);
        var deg = Math.atan2(dx, dy) * 180 / Math.PI;
        return { lat: lat, lng: lng, bearing: deg };
      }

      function sliceRouteByFraction(coords, startFrac, endFrac) {
        var n = coords.length;
        if (n < 2) return coords;
        var s = Math.max(0, Math.floor(startFrac * (n - 1)));
        var e = Math.min(n - 1, Math.ceil(endFrac * (n - 1)));
        if (e <= s) e = Math.min(n - 1, s + 1);
        return coords.slice(s, e + 1);
      }

      function renderRouteRibbon(coords) {
        routeLayerGroup.clearLayers();
        if (!coords || coords.length < 2) return;

        var isDark = currentStyle === 'dark';
        // 1. Soft Outer Depth Shadow
        L.polyline(coords, {
          color: isDark ? 'rgba(0,0,0,0.6)' : 'rgba(15, 42, 67, 0.22)',
          weight: 11,
          opacity: 1,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(routeLayerGroup);

        // 2. Crisp Casing Border
        L.polyline(coords, {
          color: isDark ? '#0B1622' : '#FFFFFF',
          weight: 7.5,
          opacity: 0.96,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(routeLayerGroup);

        // 3. Primary Route Ribbon (Traffic-Aware Multi-Segment or Clean Signature)
        if (showTraffic) {
          var clearColor = isDark ? '#22B8AE' : '#1B7F79';
          var navyColor = isDark ? '#38BDF8' : '#0F2A43';
          // Base highway ribbon
          L.polyline(coords, {
            color: clearColor,
            weight: 4.8,
            opacity: 0.96,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(routeLayerGroup);

          // Fast expressway core section
          var fastSeg = sliceRouteByFraction(coords, 0.14, 0.62);
          if (fastSeg.length >= 2) {
            L.polyline(fastSeg, {
              color: navyColor,
              weight: 4.8,
              opacity: 0.94,
              lineCap: 'round',
              lineJoin: 'round'
            }).addTo(routeLayerGroup);
          }

          // Moderate Amber junction stretch
          var amberSeg = sliceRouteByFraction(coords, 0.60, 0.77);
          if (amberSeg.length >= 2) {
            L.polyline(amberSeg, {
              color: '#F5A524',
              weight: 5,
              opacity: 0.98,
              lineCap: 'round',
              lineJoin: 'round'
            }).addTo(routeLayerGroup);
          }

          // Heavy Red hotspot at busy urban interchange (if moderate corridor)
          if (hasModerateTraffic) {
            var redSeg = sliceRouteByFraction(coords, 0.74, 0.81);
            if (redSeg.length >= 2) {
              L.polyline(redSeg, {
                color: '#EF4444',
                weight: 5.2,
                opacity: 0.98,
                lineCap: 'round',
                lineJoin: 'round'
              }).addTo(routeLayerGroup);
            }
          }
        } else {
          L.polyline(coords, {
            color: isDark ? '#2DD4BF' : '#0F2A43',
            weight: 4.8,
            opacity: 0.96,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(routeLayerGroup);
        }

        // 4. Subtle animated directional flow shimmer
        L.polyline(coords, {
          color: '#FFFFFF',
          weight: 2,
          opacity: 0.52,
          lineCap: 'round',
          className: 'mw-route-flow'
        }).addTo(routeLayerGroup);
      }

      // Smart Non-Clipping Pins
      var pinsGroup = L.layerGroup().addTo(map);
      var destPinMarker = null;

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function renderPins() {
        pinsGroup.clearLayers();

        if (!isRouteMode) {
          var placeIcon = L.divIcon({
            className: '',
            iconSize: [0, 0],
            iconAnchor: [0, 0],
            html:
              '<div class="mw-pin-wrap">' +
                '<div class="mw-place-radar"></div>' +
                '<div class="mw-place-core"></div>' +
                '<div class="mw-pill pos-top"><span class="mw-pill-tag">&#9679;</span> ' + escapeHtml(pname) + '</div>' +
              '</div>'
          });
          L.marker([plat, plng], { icon: placeIcon, interactive: false, zIndexOffset: 400 }).addTo(pinsGroup);
          return;
        }

        // Smart placement so top-most pin puts pill below and bottom-most pin puts pill above (prevents top HUD clipping!)
        var originIsNorth = olat >= dlat;
        var originPosClass = originIsNorth ? 'pos-bottom' : 'pos-top';
        var destPosClass = originIsNorth ? 'pos-top' : 'pos-bottom';

        var originIcon = L.divIcon({
          className: '',
          iconSize: [0, 0],
          iconAnchor: [0, 0],
          html:
            '<div class="mw-pin-wrap">' +
              '<div class="mw-origin-pulse"></div>' +
              '<div class="mw-origin-dot"></div>' +
              '<div class="mw-pill ' + originPosClass + '">' +
                '<span class="mw-pill-tag">' + escapeHtml(TEXT.fromPrefix) + '</span> ' +
                escapeHtml(oname) +
              '</div>' +
            '</div>'
        });
        L.marker([olat, olng], { icon: originIcon, interactive: false, zIndexOffset: 410 }).addTo(pinsGroup);

        var destIcon = L.divIcon({
          className: '',
          iconSize: [0, 0],
          iconAnchor: [0, 0],
          html:
            '<div class="mw-pin-wrap">' +
              '<div class="mw-dest-square"></div>' +
              '<div class="mw-pill ' + destPosClass + '">' +
                '<span class="mw-pill-tag dest">' + escapeHtml(TEXT.toPrefix) + '</span> ' +
                escapeHtml(dname) +
                ' <span class="mw-pill-eta">' + routeEtaMin + ' ' + TEXT.minShort + '</span>' +
              '</div>' +
            '</div>'
        });
        destPinMarker = L.marker([dlat, dlng], { icon: destIcon, interactive: false, zIndexOffset: 420 }).addTo(pinsGroup);

        if (hasStopover) {
          var stopIcon = L.divIcon({
            className: '',
            iconSize: [0, 0],
            iconAnchor: [0, 0],
            html:
              '<div class="mw-pin-wrap">' +
                '<div class="mw-stop-diamond"></div>' +
                '<div class="mw-pill pos-top">' +
                  '<span class="mw-pill-tag stop">' + escapeHtml(TEXT.stopPrefix) + '</span> ' +
                  escapeHtml(sname) +
                '</div>' +
              '</div>'
          });
          L.marker([slatRaw, slngRaw], { icon: stopIcon, interactive: false, zIndexOffset: 415 }).addTo(pinsGroup);
        }
      }

      // Full-Route Auto-Fit (Generous padding so entire route + pins are ALWAYS visible)
      function fitFullRoute(animate) {
        if (!isRouteMode) {
          map.setView([plat, plng], 14, { animate: !!animate, duration: 0.45 });
          return;
        }
        var pts = activeRouteCoords.length >= 2
          ? activeRouteCoords.slice()
          : [[olat, olng], [dlat, dlng]];
        pts.push([olat, olng], [dlat, dlng]);
        if (hasStopover) pts.push([slatRaw, slngRaw]);

        var bounds = L.latLngBounds(pts);
        var h = window.innerHeight || 400;
        var padY = h < 280 ? 48 : 60;
        var padX = 54;
        map.fitBounds(bounds, {
          paddingTopLeft: [padX, padY + 8],
          paddingBottomRight: [padX, padY],
          maxZoom: 13,
          animate: !!animate,
          duration: 0.45
        });
      }

      // Hero Animated Vehicle Marker
      var heroMarker = null;
      var heroRotatorEl = null;

      function initHeroVehicle() {
        if (!isRouteMode) return;
        var auraClass = mode === 'supply' ? 'mw-vehicle-aura supply' : 'mw-vehicle-aura';
        var icon = L.divIcon({
          className: '',
          iconSize: [48, 48],
          iconAnchor: [24, 24],
          html:
            '<div class="mw-vehicle-container">' +
              '<div class="' + auraClass + '"></div>' +
              '<div class="mw-vehicle-rotator" id="heroVehicleRotator">' +
                buildVehicleSvg(mode, 40) +
              '</div>' +
            '</div>'
        });
        heroMarker = L.marker([olat, olng], { icon: icon, interactive: false, zIndexOffset: 550 }).addTo(map);
        setTimeout(function () {
          heroRotatorEl = document.getElementById('heroVehicleRotator');
        }, 0);
      }

      // 3 Nearby Cruising Uber Cars (subtle translucent ambient traffic)
      var nearbyVehicles = [];

      function initNearbyCars() {
        if (!showNearbyCars) return;
        var anchorLat = isRouteMode ? (olat * 0.58 + dlat * 0.42) : plat;
        var anchorLng = isRouteMode ? (olng * 0.58 + dlng * 0.42) : plng;
        var span = isRouteMode
          ? Math.max(0.014, Math.min(0.06, haversineKm(olat, olng, dlat, dlng) * 0.0011))
          : 0.011;

        var configs = [
          {
            start: [anchorLat + span * 0.52, anchorLng - span * 0.58],
            end:   [anchorLat - span * 0.25, anchorLng + span * 0.42],
            curve: 0.16,
            period: 17500,
            phase: 0.12
          },
          {
            start: [anchorLat - span * 0.48, anchorLng + span * 0.55],
            end:   [anchorLat + span * 0.35, anchorLng - span * 0.18],
            curve: -0.14,
            period: 20500,
            phase: 0.48
          },
          {
            start: [anchorLat + span * 0.22, anchorLng + span * 0.62],
            end:   [anchorLat - span * 0.45, anchorLng - span * 0.44],
            curve: 0.18,
            period: 19000,
            phase: 0.78
          }
        ];

        for (var i = 0; i < configs.length; i++) {
          var c = configs[i];
          var arcCoords = buildCurvedSegment(c.start[0], c.start[1], c.end[0], c.end[1], 24, c.curve);
          // Create smooth round-trip loop so nearby cars never jump
          var loopCoords = arcCoords.concat(arcCoords.slice(0, -1).reverse());
          var arc = computeArcData(loopCoords);
          var elId = 'nearbyCarRotator_' + i;
          var icon = L.divIcon({
            className: '',
            iconSize: [26, 26],
            iconAnchor: [13, 13],
            html: '<div class="mw-nearby-rotator" id="' + elId + '">' + buildVehicleSvg('nearby', 24) + '</div>'
          });
          var marker = L.marker(loopCoords[0], { icon: icon, interactive: false, zIndexOffset: 300 }).addTo(map);
          nearbyVehicles.push({
            marker: marker,
            arc: arc,
            period: c.period,
            phase: c.phase,
            elId: elId,
            el: null
          });
        }
      }

      // Smooth 60fps requestAnimationFrame Animation Loop
      var HERO_SWEEP_MS = 14000;
      var animStartTs = null;

      function easeInOutSoft(t) {
        // Gentle acceleration at origin and deceleration at destination
        return t < 0.08
          ? (t / 0.08) * (t / 0.08) * 0.08
          : (t > 0.92 ? 1 - Math.pow((1 - t) / 0.08, 2) * 0.08 : t);
      }

      function animateFrame(ts) {
        if (animStartTs === null) animStartTs = ts;
        var elapsed = ts - animStartTs;

        // 1. Animate hero service vehicle along real road polyline
        if (isRouteMode && heroMarker && routeArcData) {
          var rawT = (elapsed % HERO_SWEEP_MS) / HERO_SWEEP_MS;
          var smoothT = easeInOutSoft(rawT);
          var sample = sampleAlongArc(routeArcData, smoothT);
          heroMarker.setLatLng([sample.lat, sample.lng]);
          if (!heroRotatorEl) {
            heroRotatorEl = document.getElementById('heroVehicleRotator');
          }
          if (heroRotatorEl) {
            heroRotatorEl.style.transform = 'rotate(' + sample.bearing.toFixed(1) + 'deg)';
          }
        }

        // 2. Animate nearby cruising Uber cars
        for (var i = 0; i < nearbyVehicles.length; i++) {
          var nv = nearbyVehicles[i];
          var t = ((elapsed / nv.period) + nv.phase) % 1;
          var s = sampleAlongArc(nv.arc, t);
          nv.marker.setLatLng([s.lat, s.lng]);
          if (!nv.el) nv.el = document.getElementById(nv.elId);
          if (nv.el) {
            nv.el.style.transform = 'rotate(' + s.bearing.toFixed(1) + 'deg)';
          }
        }

        window.requestAnimationFrame(animateFrame);
      }

      // OSRM Real Qatar Road Geometry Upgrade (3.5s strict timeout)
      function fetchOsrmRoadRoute() {
        if (!isRouteMode) return;
        var waypoints = [olng.toFixed(5) + ',' + olat.toFixed(5)];
        if (hasStopover) {
          waypoints.push(slngRaw.toFixed(5) + ',' + slatRaw.toFixed(5));
        }
        waypoints.push(dlng.toFixed(5) + ',' + dlat.toFixed(5));

        var url = 'https://router.project-osrm.org/route/v1/driving/' +
          waypoints.join(';') +
          '?overview=full&geometries=geojson';

        var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
        var timerId = controller ? setTimeout(function () { controller.abort(); }, 3500) : null;

        fetch(url, controller ? { signal: controller.signal } : undefined)
          .then(function (res) {
            if (!res.ok) throw new Error('OSRM HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            if (timerId) clearTimeout(timerId);
            if (!data || !data.routes || !data.routes.length) return;
            var route = data.routes[0];
            var geom = route.geometry && route.geometry.coordinates;
            if (!Array.isArray(geom) || geom.length < 2) return;

            var roadCoords = [];
            for (var i = 0; i < geom.length; i++) {
              roadCoords.push([geom[i][1], geom[i][0]]);
            }

            // Update telemetry if caller did not explicitly override
            if (!Number.isFinite(distParam) && typeof route.distance === 'number' && route.distance > 0) {
              routeDistKm = Math.max(1, Math.round(route.distance / 1000));
            }
            if (!Number.isFinite(etaParam) && typeof route.duration === 'number' && route.duration > 0) {
              routeEtaMin = Math.max(3, Math.round(route.duration / 60));
            }

            activeRouteCoords = roadCoords;
            routeArcData = computeArcData(roadCoords);
            renderRouteRibbon(roadCoords);
            renderPins();
            updateHudUI();
            if (!userManuallyMoved) {
              fitFullRoute(true);
            }
          })
          .catch(function () {
            if (timerId) clearTimeout(timerId);
            // Smooth fallback curved route is already rendered and fitted!
          });
      }

      // HUD DOM Updates
      var elPrimary = document.getElementById('telemetryPrimary');
      var elSecondary = document.getElementById('telemetrySecondary');
      var elLiveDot = document.getElementById('liveDot');
      var elTrafficTag = document.getElementById('trafficStatusTag');
      var elBtnTraffic = document.getElementById('btnTraffic');
      var elBtnTrafficLabel = document.getElementById('btnTrafficLabel');
      var elBtnLayerLabel = document.getElementById('btnLayerLabel');
      var elBtnRecenterLabel = document.getElementById('btnRecenterLabel');
      var elServiceSwatch = document.getElementById('serviceSwatch');
      var elServiceLabel = document.getElementById('serviceLabel');

      function updateHudUI() {
        elBtnTrafficLabel.textContent = TEXT.traffic;
        elBtnTraffic.classList.toggle('active', showTraffic);
        elBtnLayerLabel.textContent = TEXT.layers[currentStyle] || TEXT.layers.google;
        elBtnRecenterLabel.textContent = isRouteMode ? TEXT.recenterRoute : TEXT.recenterPlace;
        elServiceLabel.textContent = TEXT.services[mode] || TEXT.services.trip;
        elServiceSwatch.className = 'service-swatch ' + mode;

        if (isRouteMode) {
          elPrimary.textContent = routeDistKm + ' ' + TEXT.kmUnit + ' · ' + routeEtaMin + ' ' + TEXT.minShort;
          elSecondary.textContent = routeHighway;
          if (showTraffic) {
            elLiveDot.classList.toggle('moderate', hasModerateTraffic);
            elTrafficTag.classList.toggle('moderate', hasModerateTraffic);
            elTrafficTag.textContent = hasModerateTraffic ? TEXT.trafficModerate : TEXT.trafficClear;
            elTrafficTag.style.display = 'inline-flex';
          } else {
            elLiveDot.classList.remove('moderate');
            elTrafficTag.classList.remove('moderate');
            elTrafficTag.textContent = TEXT.trafficOff;
            elTrafficTag.style.display = 'inline-flex';
          }
        } else {
          elPrimary.textContent = pname;
          elSecondary.textContent = TEXT.livePlaceSub;
          elLiveDot.classList.remove('moderate');
          elTrafficTag.classList.remove('moderate');
          elTrafficTag.textContent = showTraffic ? TEXT.trafficClear : TEXT.trafficOff;
          elTrafficTag.style.display = 'inline-flex';
        }
      }

      // Wire Interactive HUD Controls
      document.getElementById('btnTraffic').addEventListener('click', function () {
        showTraffic = !showTraffic;
        applyMapStyle();
      });

      document.getElementById('btnLayer').addEventListener('click', function () {
        var idx = stylesOrder.indexOf(currentStyle);
        currentStyle = stylesOrder[(idx + 1) % stylesOrder.length];
        applyMapStyle();
      });

      document.getElementById('btnRecenter').addEventListener('click', function () {
        userManuallyMoved = false;
        fitFullRoute(true);
      });

      document.getElementById('btnZoomIn').addEventListener('click', function () {
        map.zoomIn();
      });

      document.getElementById('btnZoomOut').addEventListener('click', function () {
        map.zoomOut();
      });

      // Responsive Resize Handler
      var resizeTimer = null;
      window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
          map.invalidateSize();
          if (!userManuallyMoved) {
            fitFullRoute(false);
          }
        }, 140);
      });

      // Boot Sequence — Instant zero-delay render, then upgrade to exact OSRM roads
      if (isRouteMode) {
        activeRouteCoords = buildFallbackRouteCoords();
        routeArcData = computeArcData(activeRouteCoords);
      }

      applyMapStyle();
      if (isRouteMode) {
        renderRouteRibbon(activeRouteCoords);
      }
      renderPins();
      initHeroVehicle();
      initNearbyCars();
      fitFullRoute(false);

      // Kick off smooth 60fps animation + async OSRM upgrade
      window.requestAnimationFrame(animateFrame);
      if (isRouteMode) {
        fetchOsrmRoadRoute();
      }
    })();
  </script>
</body>
</html>
